<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KidoCart Admin</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="toast-container" id="toast-container"></div>

  <header class="app-header">
    <div class="logo">Kido<span>Cart</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </header>

  <div class="app-container">
    <aside class="desktop-sidebar">
      <div class="logo">Kido<span>Cart</span></div>
      <nav class="side-nav">
        <a href="#" class="nav-item active" data-target="dashboard-view"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="#" class="nav-item" data-target="products-view"><i class="fas fa-box"></i> Products</a>
        <a href="#" class="nav-item" data-target="orders-view"><i class="fas fa-shopping-bag"></i> Orders</a>
        <a href="#" class="nav-item" data-target="customers-view"><i class="fas fa-users"></i> Customers</a>
      </nav>
    </aside>

    <main class="main-content">
      
      <section id="dashboard-view" class="view-section active">
        <div class="page-header">
          <h1>Overview</h1>
          <button class="icon-btn" onclick="loadDashboardData()" title="Refresh"><i class="fas fa-sync"></i></button>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-title">Today's Sales</span>
            <h2 class="stat-value" id="dash-sales">₹0</h2>
          </div>
          <div class="stat-card">
            <span class="stat-title">Pending Orders</span>
            <h2 class="stat-value" id="dash-pending">0</h2>
          </div>
          <div class="stat-card">
            <span class="stat-title">Low Stock Alerts</span>
            <h2 class="stat-value" id="dash-stock" style="color: var(--danger);">0</h2>
          </div>
        </div>
      </section>

      <section id="products-view" class="view-section">
        <div class="page-header">
          <h1>Products</h1>
          <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> Add</button>
        </div>
        <div style="margin-bottom: 20px;">
          <input type="text" id="product-search" placeholder="🔍 Search products..." onkeyup="filterProducts()" class="form-input">
        </div>
        <div class="product-grid" id="products-list">
          <div class="card empty-state">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading products...</p>
          </div>
        </div>
      </section>

      <section id="orders-view" class="view-section">
        <div class="page-header">
          <h1>Orders</h1>
        </div>
        <div class="card empty-state">
          <i class="fas fa-receipt"></i>
          <p>Order list will go here</p>
        </div>
      </section>
      
      <section id="customers-view" class="view-section">
        <div class="page-header">
          <h1>Customers</h1>
        </div>
        <div class="card empty-state">
          <i class="fas fa-users"></i>
          <p>Customer list will go here</p>
        </div>
      </section>

    </main>
  </div>

  <nav class="bottom-nav">
    <a href="#" class="nav-item active" data-target="dashboard-view"><i class="fas fa-chart-pie"></i><span>Home</span></a>
    <a href="#" class="nav-item" data-target="products-view"><i class="fas fa-box"></i><span>Products</span></a>
    <a href="#" class="nav-item" data-target="orders-view"><i class="fas fa-shopping-bag"></i><span>Orders</span></a>
  </nav>

  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Product</h2>
        <button class="icon-btn" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
      </div>
      
      <form id="product-form">
        <input type="hidden" id="modal-product-id">
        
        <div class="form-group">
          <label class="form-label">Product Name *</label>
          <input type="text" id="modal-name" class="form-input" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="modal-category" class="form-input" required>
              <option value="clothing">Clothing</option>
              <option value="toys">Toys</option>
              <option value="feeding">Feeding</option>
              <option value="diapers">Diapers & Care</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Brand</label>
            <input type="text" id="modal-brand" class="form-input" placeholder="e.g. BabyJoy">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description *</label>
          <textarea id="modal-description" class="form-input" rows="3" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Actual Price (₹)</label>
            <input type="number" id="modal-original-price" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Discounted Price (₹) *</label>
            <input type="number" id="modal-price" class="form-input" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Stock *</label>
            <input type="number" id="modal-stock" class="form-input" required>
          </div>
          <div class="form-group file-upload-box" style="padding: 10px; margin-bottom: 0;">
            <label class="form-label" style="margin-bottom: 2px;">Upload Images</label>
            <small style="display:block; margin-bottom: 5px; color:var(--text-muted);">Select multiple if needed</small>
            <input type="file" id="modal-images" accept="image/*" multiple style="width: 100%; font-size: 12px;">
          </div>
        </div>

        <div style="margin-top: 20px;">
          <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-save"></i> Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
