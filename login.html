<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KidoCart Admin — Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      background: radial-gradient(1200px 600px at 50% 0%, rgba(255, 107, 53, 0.08), transparent 70%), var(--bg-app);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 34px 28px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
    }
    .login-brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand-logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--primary), #FF8A5B);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.28);
    }
    .login-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }
    .login-title span {
      color: var(--primary);
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .alert-banner {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .alert-banner.error {
      background: var(--danger-light);
      color: var(--danger-text);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .alert-banner.info {
      background: var(--info-light);
      color: var(--info-text);
      border: 1px solid rgba(2, 132, 199, 0.25);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand-header">
        <div class="login-brand-logo">
          <i class="fas fa-shopping-bag"></i>
        </div>
        <div class="login-title">Kido<span>Cart</span> Admin</div>
        <div class="login-subtitle">Sign in to manage store operations</div>
      </div>

      <div class="alert-banner error" id="error-box">
        <i class="fas fa-triangle-exclamation"></i>
        <span id="error-message-text">Invalid admin credentials</span>
      </div>

      <div class="alert-banner info" id="info-box">
        <i class="fas fa-circle-info"></i>
        <span id="info-message-text">Session expired. Please log in again.</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" placeholder="Admin username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 10px 16px;" id="login-btn">
          <i class="fas fa-arrow-right-to-bracket"></i> Sign In
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'https://admin.kidocart.shop';

    // Check for session expired query param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired') === 'true') {
      const infoBox = document.getElementById('info-box');
      if (infoBox) infoBox.style.display = 'flex';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error-box');
      const errorText = document.getElementById('error-message-text');
      const infoBox = document.getElementById('info-box');
      const loginBtn = document.getElementById('login-btn');
      
      errorBox.style.display = 'none';
      if (infoBox) infoBox.style.display = 'none';
      
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Authentication failed');

        // Save token securely
        localStorage.setItem('admin_token', data.token);
        
        // Redirect to dashboard
        window.location.href = 'index.html';

      } catch (err) {
        errorText.textContent = err.message;
        errorBox.style.display = 'flex';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
      }
    });
  </script>
</body>
</html>
